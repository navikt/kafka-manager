name: Build, push and deploy
on:
  workflow_dispatch:
  push:

jobs:
  test-api:
    name: Run backend tests
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: ./gradlew :api:check

  test-web-app:
    name: Run frontend checks
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Configure GitHub Packages authentication
        run: printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"

      - run: ./gradlew :web-app:check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

  build-and-push:
    name: Build and push (main)
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create image tag
        run: echo "IMAGE_TAG=$(TZ='Europe/Oslo' date +%Y.%m.%d-%H.%M)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Configure GitHub Packages authentication
        run: printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"

      - run: ./gradlew build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
          VITE_APP_VERSION: ${{ env.IMAGE_TAG }}

      - name: Build and push image
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker
        with:
          team: poao
          tag: ${{ env.IMAGE_TAG }}

      - name: Tag image as latest
        env:
          IMAGE_REF: ${{ steps.docker.outputs.image }}
        run: |
          set -euo pipefail

          image="${IMAGE_REF%@*}"
          image="${image%:*}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${image}:latest" \
            "${IMAGE_REF}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Release kafka-manager
          tag_name: ${{ env.IMAGE_TAG }}
          prerelease: false
