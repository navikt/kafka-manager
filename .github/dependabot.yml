version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/web-app"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      major-updates:
        update-types:
          - "major"
      nav-dependencies:
        patterns:
          - "@navikt/*"
          - "@nais/*"
      development-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      major-updates:
        update-types:
          - "major"
      nav-dependencies:
        patterns:
          - "no.nav*"
      other-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      workflow-updates:
        patterns:
          - "*"
