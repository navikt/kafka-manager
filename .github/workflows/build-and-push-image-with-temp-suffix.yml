name: Build and push docker image with TEMP-suffix
on: workflow_dispatch
jobs:
  build_and_push:
    permissions:
      contents: 'write'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build application
        run: ./gradlew :api:build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
          npm_config_legacy_peer_deps: "true"

      - name: Create image tag
        run: echo "IMAGE_TAG=$(TZ=\"Europe/Oslo\" date +%Y.%m.%d_%H.%M)-$(git rev-parse --short=12 HEAD)-temp" >> $GITHUB_ENV

      - name: Build and push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # ratchet:nais/docker-build-push@v0
        id: docker-build-push
        with:
          tag: ${{ env.IMAGE_TAG }}
          team: poao
          image_suffix: 'temp'


      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3.0.3
        with:
          name: Release kafka-manager-temp
          tag_name: ${{ env.IMAGE_TAG }}
          prerelease: true
