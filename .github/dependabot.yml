version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.READER_TOKEN}}
    replaces-base: false

updates:
  - package-ecosystem: "npm"
    directory: "/web-app"
    registries:
      - npm-github
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      major:
        update-types:
          - 'major'
      minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      workflow-updates:
        patterns:
          - '*'
