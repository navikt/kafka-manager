name: Build, push and deploy
on:
  workflow_dispatch:
  push:

jobs:
  test-api:
    name: Run backend tests
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - run: ./gradlew :api:check

  test-web-app:
    name: Run frontend tests
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - run: ./gradlew :web-app:testFrontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

  build-and-push:
    name: Build and push (main)
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6

      - name: Create image tag
        run: echo "IMAGE_TAG=$(TZ='Europe/Oslo' date +%Y.%m.%d-%H.%M)-$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - run: ./gradlew build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
          npm_config_min_release_age: "7"

      - name: Build and push image
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # ratchet:nais/docker-build-push@v0
        id: docker
        with:
          team: poao
          tag: ${{ env.IMAGE_TAG }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3.0.3
        with:
          name: Release kafka-manager
          tag_name: ${{ env.IMAGE_TAG }}
          prerelease: false
